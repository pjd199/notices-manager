name: Release WordPress Plugin

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

env:
  PLUGIN_SLUG: advanced-notices-manager

jobs:
  build_release:
    runs-on: ubuntu-latest
    steps:
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'

      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Get Plugin Version
        id: get_version
        run: |
          VERSION=$(grep -m 1 "Version:" ${{ env.PLUGIN_SLUG }}.php | awk '{print $NF}' | tr -d '\r')
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT

      - name: Build plugin
        run: |
          composer install --no-dev --optimize-autoloader

      - name: Generate zip
        uses: 10up/action-wordpress-plugin-build-zip@stable
        env:
          SLUG: ${{ env.PLUGIN_SLUG }}

      - name: Prepare Plugin for Zipping
        run: |
          mkdir -p ${{ env.PLUGIN_SLUG }}
          
          # Copy your specific architecture folders
          cp -r admin ${{ env.PLUGIN_SLUG }}/
          cp -r vendor ${{ env.PLUGIN_SLUG }}/
          cp ${{ env.PLUGIN_SLUG }}.php ${{ env.PLUGIN_SLUG }}/
          if [ -f uninstall.php ]; then cp uninstall.php ${{ env.PLUGIN_SLUG }}/; fi
          
          # Include README/License if they exist
          if [ -f README.md ]; then cp README.md ${{ env.PLUGIN_SLUG }}/; fi
          if [ -f LICENSE ]; then cp LICENSE ${{ env.PLUGIN_SLUG }}/; fi

      - name: Create Zip Archive
        run: |
          zip -r ${{ env.PLUGIN_SLUG }}-${{ env.VERSION }}.zip ${{ env.PLUGIN_SLUG }}/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ env.VERSION }}
          name: Release v${{ env.VERSION }}
          files: ${{ env.PLUGIN_SLUG }}-${{ env.VERSION }}.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}